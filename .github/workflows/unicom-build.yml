name: Unicom Fetch & Build
# 中国联通资费抓取（全国 + 31 省），产物提交到 unicom/data
#
# 定时：不再单独看 cron。联通跟随主站（mobile-build.yml）的节拍，
# 每轮移动抓取开始时由主站的 subsites 作业一并派发；这里保留
# workflow_dispatch 供手动 / 心跳 / 看门狗调用。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unicom-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 累积池 _pool.json 约 68MB，是跨轮对比的基线：压缩后放 Actions 缓存，
      # 不再每轮入库。缓存不可用时只丢一轮变化检测，不影响数据更新。
      - name: 还原联通累积池
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: unicom/_pool.json.gz
          key: unicom-poolgz-${{ github.run_id }}
          restore-keys: |
            unicom-poolgz-

      - name: 解压累积池
        continue-on-error: true
        run: |
          if [ -f unicom/_pool.json.gz ]; then
            mkdir -p unicom/data
            gunzip -cf unicom/_pool.json.gz > unicom/data/_pool.json
            echo "已还原累积池 $(du -h unicom/data/_pool.json | cut -f1)"
          else
            echo "无缓存池，本轮从仓库现有池 / 空池开始"
          fi

      - name: 抓取联通资费（全国 + 31 省）
        run: |
          set -e
          set -o pipefail
          cd "$GITHUB_WORKSPACE/pipelines"
          # 累积池 _pool.json 在 prev-dir 里，必须与 out-dir 同目录
          python3 -u unicom_pipeline.py --prev-dir ../unicom/data --out-dir ../unicom/data 2>&1 | tail -150
          python3 -c "import json;d=json.load(open('../unicom/data/latest.json',encoding='utf-8'));print('[联通] updated =',d.get('updated'),'| 板块 =',len(d.get('sections',[])))"

      - name: 体量闸门（防池残缺导致数据缩水）
        run: |
          set -e
          OLDQ=$(git show HEAD:unicom/data/latest.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('quanguo_total',0))" || echo 0)
          NEWQ=$(python3 -c "import json;print(json.load(open('unicom/data/latest.json',encoding='utf-8')).get('quanguo_total',0))")
          echo "上轮全网 $OLDQ 条 → 本轮 $NEWQ 条"
          if [ "$OLDQ" -gt 0 ] && [ "$NEWQ" -lt $(( OLDQ * 6 / 10 )) ]; then
            echo "::error::本轮全网条数较上轮缩水超过 40%，疑似累积池残缺，放弃提交并保留线上数据"
            exit 1
          fi

      - name: 保存联通累积池
        # 只在本轮成功时保存：此前是 always()，被取消的轮次也会把「抓到一半」的
        # 池写进缓存，下一轮 restore 到残缺池 → 误判首次基线，线上 3851 条被砍到 613 条。
        if: success()
        continue-on-error: true
        run: |
          if [ -f unicom/data/_pool.json ]; then
            gzip -9cf unicom/data/_pool.json > unicom/_pool.json.gz
            echo "池已压缩 $(du -h unicom/_pool.json.gz | cut -f1)"
          fi
      - name: 写入缓存
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: unicom/_pool.json.gz
          key: unicom-poolgz-${{ github.run_id }}

      - name: 提交
        if: success()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a unicom/data /tmp/art/data || { echo "::error::产物缺失"; exit 1; }
          # 池文件已由缓存接管，不再入库
          rm -f /tmp/art/data/_pool.json
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            rm -rf unicom/data
            cp -a /tmp/art/data unicom/data || { echo "::error::data 复制失败"; exit 1; }
            git add -A unicom/data
            BAD="$(git diff --cached --name-only | grep -vE '^unicom/data/' || true)"
            if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止"; echo "$BAD"; exit 1; fi
            if git diff --cached --quiet; then echo "无变化"; exit 0; fi
            git commit -q -m "unicom fetch $(date -u +%FT%TZ)"
            if git push origin main; then echo "已推送"; exit 0; fi
            echo "[warn] push 失败，重新对齐后重试 ($i/5)"
            sleep 8
          done
          echo "::error::连续 5 次 push 均失败"
          exit 1

# fork: enabled for personal deployment
