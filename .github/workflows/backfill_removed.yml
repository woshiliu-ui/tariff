name: backfill-removed-details

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run backfill
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/backfill_removed.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/guard_ui.py || true
          git add -A data
          BAD="$(git diff --cached --name-only | grep -vE '^data/' || true)"
          if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止"; echo "$BAD"; exit 1; fi
          if git diff --cached --quiet; then
            echo "无改动"
          else
            git commit -m "backfill: 回填历史变更中未存快照的业务字段"
            git push
          fi

# fork: enabled for personal deployment
