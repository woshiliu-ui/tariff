name: verify-backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_backfill.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/guard_ui.py || true
          git add -A data backfill_report.txt
          BAD="$(git diff --cached --name-only | grep -vE '^(data/|backfill_report\.txt$)' || true)"
          if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止"; echo "$BAD"; exit 1; fi
          if git diff --cached --quiet; then echo "无改动"; else
            git commit -m "chore: 恢复 history.json 缩进格式 + 回填校验报告"
            git push
          fi

# fork: enabled for personal deployment
