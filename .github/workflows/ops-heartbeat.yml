name: Ops Heartbeat
# 三家运营商（电信/联通/广电）的自续心跳，作用与 Mobile Heartbeat 相同：
# 绕开 GitHub schedule 对本仓库的丢触发/数小时延迟。
#
# 2026-11-20：三家已改为跟随主站节拍（mobile-build 每轮派发），
# 本工作流降为兜底：数据超过 3 小时未更新且没有运行在跑时才补触发。
#
# 实测（2026-11-18 全日）：schedule 只让三家各跑成 1 轮（电信/广电本应 6 轮、
# 联通 4 轮），其余 cron 点全部被跳过，数据因此只能靠偶发延迟放行的那轮更新。
# 本工作流常驻循环：按线上 <op>/data/latest.json 的时间戳判断数据是否够旧，
# 够旧且该管线没有正在跑/排队的运行就 dispatch 一轮，跑完再继续等。
# 单次运行接近 runner 上限前用 workflow_dispatch 续期，循环永续。
#
# 说明：与 API 的交互一律用 curl + GITHUB_TOKEN（不依赖 gh）。此前版本用
# gh api，在 runner 上全部失败且错误被 2>/dev/null 吞掉，心跳因此永远判定
# 「有运行在跑」而不敢触发，等于空转。

on:
  # 不再用 workflow_run 触发：三家子站每跑完一轮就重启一次心跳，循环刚进入
  # 等待就被 cancel-in-progress 杀掉，日志里全是 cancelled（一晚上几十次），
  # 心跳实际上从没跑满过一轮。改由本工作流自续期 + build-watchdog 保活。
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: ops-heartbeat
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    # 同 mobile-heartbeat：长驻 job 卡死会永久占用 runner 与并发组，缩到 120 分钟
    timeout-minutes: 120
    steps:
      - name: 循环驱动三家抓取
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TH_TELECOM: "10800"
          TH_GB: "10800"
          TH_UNICOM: "10800"
        run: |
          set -e
          DEADLINE=$(( $(date -u +%s) + 100 * 60 ))
          MIN_GAP=900
          LAST_DISPATCH=0

          # 统一带重试的 API 调用；错误可见，不再静默吞掉
          api() {
            local url="$1" i out
            for i in 1 2 3; do
              if out=$(curl -fsSL --max-time 30 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: ops-heartbeat" "$url" 2>/tmp/api_err); then
                printf '%s' "$out"; return 0
              fi
              echo "[warn] API 调用失败（$i/3，$url）：$(head -c 120 /tmp/api_err)" >&2
              sleep 10
            done
            return 1
          }

          api_post() {
            local url="$1" i out
            for i in 1 2 3; do
              if out=$(curl -fsS --max-time 30 -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "User-Agent: ops-heartbeat" \
                -H "Content-Type: application/json" \
                -d '{"ref":"main"}' "$url" 2>/tmp/api_err); then
                printf '%s' "$out"; return 0
              fi
              echo "[warn] 触发失败（$i/3，$url）：$(head -c 120 /tmp/api_err)" >&2
              sleep 10
            done
            return 1
          }

          RENEWED=0
          renew() {
            [ "$RENEWED" = "1" ] && return 0
            RENEWED=1
            if api_post "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ops-heartbeat.yml/dispatches" >/dev/null; then
              echo "已续期新心跳 $(date -u +%FT%TZ)"
            else
              echo "::warning::心跳续期失败，等待 build-watchdog 兜底"
            fi
          }
          trap renew EXIT

          latest_updated() {
            local u
            u=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/$1/data/latest.json" \
                | jq -r '.updated // empty' 2>/dev/null) || u=""
            printf '%s' "$u"
          }

          data_age() {
            local u t
            u=$(latest_updated "$1")
            [ -n "$u" ] || { echo 999999; return 0; }
            t=$(date -u -d "$u" +%s 2>/dev/null) || { echo 999999; return 0; }
            echo $(( $(date -u +%s) - t ))
          }

          # 运行在跑/排队的数量。API 取不到时按 0 处理（宁可多触发一次，
          # 由各管线的并发组与数据阈值兜住，心跳不能因此永远空转）。
          count_active() {
            local out n
            out=$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1.yml/runs?per_page=5") || { echo 0; return 0; }
            n=$(printf '%s' "$out" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length' 2>/dev/null) || n=0
            echo "$n"
          }

          dispatch() {
            if api_post "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1.yml/dispatches" >/dev/null; then
              echo "已触发 $1 $(date -u +%FT%TZ)"
              return 0
            fi
            echo "::warning::触发 $1 失败，等下一轮循环"
            return 1
          }

          OPS="telecom-build gb-build unicom-build"

          while :; do
            LEFT=$(( DEADLINE - $(date -u +%s) ))
            [ "$LEFT" -le 0 ] && break

            STALE=""
            for op in $OPS; do
              dir=$(echo "$op" | sed 's/-build//')
              age=$(data_age "$dir")
              case "$dir" in
                telecom) th=$TH_TELECOM ;;
                gb)      th=$TH_GB ;;
                unicom)  th=$TH_UNICOM ;;
              esac
              active=$(count_active "$op")
              printf '[%s] 数据距今 %s 分钟（阈值 %s 分钟），运行数 %s' "$dir" "$((age/60))" "$((th/60))" "$active"
              if [ "$age" -ge "$th" ] && [ "$active" = "0" ]; then
                STALE="$STALE $op"
                printf ' → 触发\n'
              else
                printf ' → 无需触发\n'
              fi
            done

            if [ -n "$STALE" ]; then
              DISPATCHED=0
              for op in $STALE; do
                if [ $(( $(date -u +%s) - LAST_DISPATCH )) -ge "$MIN_GAP" ] && dispatch "$op"; then
                  LAST_DISPATCH=$(date -u +%s)
                  DISPATCHED=1
                fi
              done
              if [ "$DISPATCHED" = "1" ]; then
                while [ "$(date -u +%s)" -lt "$DEADLINE" ]; do
                  sleep 60
                  ACTIVE=0
                  for op in $OPS; do
                    a=$(count_active "$op")
                    [ "$a" = "0" ] || ACTIVE=1
                  done
                  [ "$ACTIVE" = "0" ] && break
                done
                continue
              fi
            fi

            SLEEP=$(( LEFT < 300 ? LEFT : 300 ))
            echo "=== 睡眠 $((SLEEP/60)) 分钟至 $(date -u -d "+$SLEEP seconds" +%FT%TZ) ==="
            sleep "$SLEEP"
          done

          echo "时间预算用尽 $(date -u +%FT%TZ)"
          renew

# fork: enabled for personal deployment
