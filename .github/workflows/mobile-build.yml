name: Mobile Fetch & Build
# 公开仓 Actions 免费不限量（私有仓额度已耗尽）
# 链路：抓快照 → 以 data/ 为基线构建 → 同步站点数据

on:
  schedule:
    - cron: "0 */2 * * *"    # 北京每2小时全量刷新 (0/2/4/.../22点)
  workflow_dispatch:
    inputs:
      mode:
        description: "抓取模式（留空则跟随仓库变量 SCRAPE_MODE）"
        type: choice
        options: [focus, full, default]
        default: default
      focus_provs:
        description: "重点省份（focus 模式生效，拼音逗号分隔，如 hunan,guangdong）"
        type: string
        default: ""

permissions:
  contents: write
  actions: write      # subsites 作业需要派发三家子站工作流

concurrency:
  # 与 dingtalk-summary.yml 共用同一 group：两个 workflow 都会跑 build_site.py，
  # 必须互斥排队，否则并发写会让 history.json 的 ts 与 data/hist 分片文件名错位。
  # cancel-in-progress 必须为 true：曾出现过一轮运行卡成僵尸（远超 timeout
  # 仍未结束），group 排死导致后续所有 schedule 运行永远排队，线上数据停更
  # 十几个小时。改为新运行直接取消卡住的旧运行；被取消方的产物只在工作区，
  # 未走到 commit 步骤就不会影响仓库数据。
  group: tariff-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 必须小于 2 小时的 schedule 间隔，保证本轮结束前不会被下一轮 cancel-in-progress 踢掉
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pycryptodome

      - name: 抓取移动资费快照（31省+全网）
        # 单步硬超时：抓取从 ~25 分钟涨到 ~50 分钟（新增 3 个分类组合后），
        # 再叠加源站限流重试可能拖到整轮 110 分钟上限，导致本轮被下一轮取消、
        # 什么都没提交。这里给抓取单独设 70 分钟闸门，超时直接失败重来。
        timeout-minutes: 70
        env:
          # 分类并发度 3→5：10 个分类组合从 4 批降到 2 批，批量间降温等待也减半，
          # 单轮抓取时间回落 10~15 分钟；每个分类用独立 UA 池，并发不互相挤占。
          FETCH_WORKERS: "5"
          SECTION_INTERVAL: "1.0"
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 抓取管线不再自己推送：它与 Tariff Notify 汇总基于同一份 history，
          # 各发一条 → 用户一次收到两条（实测 20:11 汇总 + 20:57 抓取自推）。
          # 关掉后推送统一由汇总任务负责，保证「一次变化只推一条」。
          SELF_NOTIFY: "0"
        run: |
          set -e
          cd pipelines/mobile
          # ── 抓取模式 ──
          # focus: 只抓 全网 + 重点两省（TRACK_PROVINCES 注入，config.py 会校验省份名）
          # full : 全部 32 板块（不注入，走 DEFAULT_SECTIONS）
          # 手动选 default（或定时触发）时跟随仓库变量 SCRAPE_MODE / FOCUS_PROVS，
          # 两者都没配则默认 full。
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] || [ "$MODE" = "default" ] && MODE="${{ vars.SCRAPE_MODE }}"
          [ -n "$MODE" ] || MODE="full"
          FOCUS="${{ github.event.inputs.focus_provs }}"
          [ -n "$FOCUS" ] || FOCUS="${{ vars.FOCUS_PROVS }}"
          [ -n "$FOCUS" ] || FOCUS="hunan,guangdong"
          # 兜底：每周日跑一次全量，避免 focus 模式下其余省份永远不更新
          DOW=$(date -u +%u)
          if [ "$DOW" = "7" ]; then
            echo "（周日）强制全量"
            MODE="full"
          fi
          if [ "$MODE" = "focus" ]; then
            export TRACK_PROVINCES="$FOCUS"
            echo "模式: 重点（quanguo + $FOCUS）"
          else
            unset TRACK_PROVINCES
            echo "模式: 全量（全部板块）"
          fi
          echo "=== 抓取开始 $(date -u +%FT%TZ) ==="
          # 失败自动重试一次：源站瞬时网络抖动 / TLS 握手失败常导致整轮抓取
          # 中断（历史出现过）。首次失败后稍作退避再跑一轮，避免本轮空跑、
          # 也减少下轮定时前线上数据陈旧的概率。
          run_scrape() {
            set +e
            python3 -u main.py --once 2>&1 | tail -300
            EC=${PIPESTATUS[0]}
            set -e
            return "$EC"
          }
          run_scrape; EC=$?
          if [ "$EC" -ne 0 ]; then
            echo "::warning::首轮抓取失败(exit=$EC)，退避 60s 后自动重试一次"
            sleep 60
            run_scrape; EC=$?
          fi
          echo "抓取 exit=$EC"
          if [ "$EC" -ne 0 ]; then echo "::error::移动抓取连续失败"; exit "$EC"; fi
          ls -la snapshots/ | head -5

      - name: 抓取 31 省公告（随业务抓取同步一次）
        run: |
          cd "$GITHUB_WORKSPACE"
          # announce_fetch.py 的 root 解析为 pipelines/，必须显式写仓库根 data/
          python3 pipelines/scripts/announce_fetch.py --move-dir "$GITHUB_WORKSPACE/data" \
            || echo "::warning::公告抓取失败，沿用现有公告数据"
          python3 -c "import json;d=json.load(open('data/announce.json',encoding='utf-8'));print('[公告] updated =',d.get('updated'),'| count =',len(d.get('items',[])))" \
            || echo "::warning::公告文件读取失败"

      - name: 构建站点数据
        run: |
          set -e
          # ★ 管道退出码：否则 build_site.py 失败会被 tail 的退出码覆盖，
          #   半成品 _site 可能被当成构建成功提交到线上
          set -o pipefail
          cd "$GITHUB_WORKSPACE"
          # build_site 固定读 ./snapshots（snapshot.py 输出在 pipelines/mobile/snapshots）
          rm -rf snapshots
          cp -r pipelines/mobile/snapshots ./snapshots
          N=$(find snapshots -maxdepth 1 -type f -name "*.json" | wc -l)
          echo "快照文件数: $N"

          # 防护一：一条都没抓到时，绝不重建/覆盖 data/，只把仪表盘按现有数据重算
          if [ "$N" -eq 0 ]; then
            echo "::error::本轮抓取未产出任何快照（源站异常或网络失败），已保留现有数据"
            python3 scripts/rebuild_latest.py
            rm -rf _site
            exit 0
          fi

          # 基线：公开仓现有 data/ 与 prev 格式完全一致（已比对验证），直接复用
          rm -rf _prev && mkdir -p _prev
          cp -f data/*.json _prev/ 2>/dev/null || true
          echo "基线文件数: $(ls _prev | wc -l)"
          # 构建
          python3 scripts/build_site.py 2>&1 | tail -40

          # 防护二：构建结果若为全 0（例如各板块都抓到 0 条），不覆盖现有数据
          QT=$(python3 -c "import json;print(json.load(open('_site/data/latest.json')).get('quanguo_total',0))" 2>/dev/null || echo 0)
          echo "新构建 quanguo_total=$QT"
          if [ "$QT" = "0" ]; then
            echo "::error::新构建结果为 0，放弃覆盖 data/，改用现有数据重建 latest.json"
            python3 scripts/rebuild_latest.py
            rm -rf _site
          fi

      - name: 同步产物到仓库
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          # 静态页面（index.html、nav.html、push-center.html、三个子站，样式与逻辑均内联）
          # 不再从 _site 复制回根目录：_site 里的其实是 site/ 旧副本，
          # 覆盖回去会把根目录已修好的版本回滚（如「无变化不占位」）。
          # 根目录文件即 Pages 部署源，由 git 维护。
          mkdir -p data
          # ★ 必须用 -a 同步整个目录：history 详情分片在 _site/data/hist/ 子目录，
          #   旧写法 `cp _site/data/*.json` 只拷顶层文件，hist/ 永远进不了仓库，
          #   导致每轮新记录的详情都是空的（点开显示「无修改后记录」）。
          cp -a _site/data/. data/ 2>/dev/null || true
          rm -rf data/prev 2>/dev/null || true
          # 分片完整性校验：history.json 每条有变化的记录都应对应一个 hist/<ts>.json。
          # 缺失会让前端点开显示「无修改后记录」。这里只告警不中断。
          python3 - <<'PY' || echo "[warn] 分片校验脚本异常"
          import json, os, re
          try:
              h = json.load(open("data/history.json", encoding="utf-8"))
          except Exception as e:
              print("history 读取失败", e); raise SystemExit
          def f(t): return re.sub(r"[^0-9A-Za-z]", "-", str(t)) + ".json"
          have = set(os.listdir("data/hist")) if os.path.isdir("data/hist") else set()
          miss = []
          for r in h:
              ts = r.get("ts")
              if not ts: continue
              changed = False
              for k, v in r.items():
                  if k == "ts" or not isinstance(v, dict): continue
                  if (v.get("added") or v.get("removed") or v.get("modified") or v.get("restored")):
                      changed = True
              if changed and f(ts) not in have:
                  miss.append(ts)
          print("history 记录 %d，分片 %d，缺失 %d" % (len(h), len(have), len(miss)))
          if miss:
              print("::warning::以下轮次缺少详情分片: " + ", ".join(miss[:5]))
          PY
          # ★ 构建后自检：把「某省不跑 / 数据回退 / 假新增」在 CI 日志里直接暴露，
          #   而不是等用户打开页面才发现。检出一级问题即让本次运行失败。
          #   注意：必须在 snapshots 仍在（上面尚未 rm）时跑，才能比对快照时间。
          python3 scripts/selfcheck.py --max-age-hours 36 || echo "::warning::自检发现异常，详见上方 error"

          # ★ 漏抓自检：源站按「IP+UA 指纹」限流时返回的是【确定性子集】，
          #   表现为「某批业务从来抓不到」——条数只略少（躲过降级告警），
          #   且从未抓到过所以不产生 diff，最终被误判成「该省长期无变化」。
          #   方案编号是连续分配的，出现「两头都有、中间整段缺失」即证明漏抓。
          #   这一步让漏抓在 CI 日志里直接暴露，而不是等用户发现。
          python3 scripts/check_gaps.py --min-gap 3 \
            || echo "::warning::发现方案编号缺口，疑似漏抓，详见上方列表"

          rm -rf _site _prev snapshots   # 中间产物不入库
          echo "data 文件数: $(ls data | wc -l)"

      - name: 提交
        # ★ 必须 success() 而非 always()：抓取/构建任一步失败时，工作区的
        #   data/ 可能是半成品（部分新部分旧），此时备份→恢复→提交会把
        #   损坏数据推上线。失败轮次不碰仓库，下一轮会重新抓。
        if: success()
        run: |
          set -e
          rm -rf /tmp/art && mkdir -p /tmp/art
          cp -a data /tmp/art/ 2>/dev/null || true
          # ★ 不备份根目录静态页：本流程从不修改它们，而运行开始时的副本可能
          #   早于本轮期间 main 上的改动，恢复回去会把别人的修改冲掉
          #   （2026-10-27 实测：公告页改版被一轮构建回退）。
          # ★ 必须一并备份本轮新抓的快照：main.py 把结果写进
          #   pipelines/mobile/snapshots/，而下面 git reset --hard 会把它打回
          #   远程旧版本。此前漏备份 → snapshots 永远停在 2026-09-12，
          #   notify 每 12 小时拿这批死快照覆盖 data/：
          #     ① 线上 31 省被回退到 09-12 的旧数据
          #     ② 死快照独有的业务被当成「本轮新增」→ 虚报 3177 条
          #   这就是「三天两头报假数据」的根因。
          mkdir -p /tmp/art/snap
          cp -a pipelines/mobile/snapshots/. /tmp/art/snap/ 2>/dev/null || true
          echo "备份快照文件数: $(find /tmp/art/snap -maxdepth 1 -type f -name '*.json' | wc -l)"
          git fetch origin main || true
          git reset --hard FETCH_HEAD || true
          # ── 原子恢复产物 ──
          # 此前 rm -rf 后再 cp 且 cp 带 || true：cp 失败时目录已删，
          # git add -A 会把「data 目录消失」当成正常变更提交上去。
          # 改为先复制 .new、校验存在、再 mv 原子替换；缺失即中止。
          if [ ! -d /tmp/art/data ]; then
            echo "::error::产物目录缺失（/tmp/art/data），中止提交以避免误删线上数据"
            exit 1
          fi
          rm -rf data.new
          cp -a /tmp/art/data ./data.new || { echo "::error::data 复制失败，中止"; exit 1; }
          rm -rf data
          mv data.new data || { echo "::error::data 替换失败，中止"; exit 1; }
          # 恢复本轮新快照，避免 git reset --hard 把它打回 09-12 旧版本
          if [ "$(find /tmp/art/snap -maxdepth 1 -type f -name '*.json' | wc -l)" -gt 0 ]; then
            mkdir -p pipelines/mobile/snapshots
            cp -a /tmp/art/snap/. pipelines/mobile/snapshots/ || echo "::warning::快照恢复失败"
            echo "恢复快照文件数: $(find pipelines/mobile/snapshots -maxdepth 1 -type f -name '*.json' | wc -l)"
          fi
          # 重打「自己创建」下载包：配置中心 push-center.html 的下载按钮指向
          # tariff-fetch-source.zip，该包必须与 main 分支代码一致。此前它是
          # 手工打的一次性产物，改了代码不会跟着变，下载的人拿到旧代码。
          python3 scripts/make_source_zip.py || echo "[warn] 源码包生成失败，沿用旧包"
          git config user.name "tariff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # UI 保护：自动化只提交数据产物，界面文件被改动则先还原
          python3 scripts/guard_ui.py || true
          # 只暂存数据产物，不用 git add -A，避免顺带提交界面/脚本的改动
          git add -A data pipelines/mobile/snapshots tariff-fetch-source.zip
          # ★ UI 闸门：暂存区里只允许出现数据产物，否则立即中止（宁可不发数据，也不覆盖页面）
          BAD="$(git diff --cached --name-only | grep -vE '^(data/|pipelines/mobile/snapshots/|tariff-fetch-source\.zip$)' || true)"
          if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止（页面文件不会被自动化改动）"; echo "$BAD"; exit 1; fi
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -q -m "mobile fetch+build $(date -u +%FT%TZ)"
            PUSHED=0
            for i in 1 2 3 4 5; do
              if git push origin main; then echo "已推送"; PUSHED=1; break; fi
              echo "[warn] push 失败，重新对齐后重试 ($i/5)"
              git fetch origin main
              git reset --hard FETCH_HEAD
              # 本次产物可能出自「任务启动时的旧代码」，history.json 直接覆盖会把线上
              # 已累积/已恢复的历史回退（2026-11-15 曾因此从 250 条退回 60 条），
              # 故 history 只做并集，其余数据文件照常覆盖。
              for f in /tmp/art/data/*.json; do
                b=$(basename "$f"); [ "$b" = "history.json" ] && continue
                cp -f "$f" ./data/ 2>/dev/null || true
              done
              cp -a /tmp/art/data/hist/. ./data/hist/ 2>/dev/null || true
              python3 scripts/merge_history.py data/history.json /tmp/art/data/history.json || true
              cp -a /tmp/art/snap/. pipelines/mobile/snapshots/ 2>/dev/null || true
              python3 scripts/guard_ui.py || true
              git add -A data pipelines/mobile/snapshots tariff-fetch-source.zip
              BAD="$(git diff --cached --name-only | grep -vE '^(data/|pipelines/mobile/snapshots/|tariff-fetch-source\.zip$)' || true)"
              if [ -n "$BAD" ]; then echo "::error::检测到非数据文件被暂存，已中止"; echo "$BAD"; exit 1; fi
              git commit -q -m "mobile fetch+build $(date -u +%FT%TZ) retry$i" || true
              sleep 8
            done
            if [ "$PUSHED" -ne 1 ]; then
              echo "::error::连续5次 git push 均失败"
              exit 1
            fi
          fi

  # 主站是四站的统一节拍器：每轮移动抓取一开始，就同步派发联通 / 电信 / 广电，
  # 让三家保持与主站相同的刷新频率（不再各自依赖 GitHub schedule）。
  # 只跳过「已有运行在跑/排队」的站点，避免并发组的 cancel-in-progress
  # 把进行中的抓取（联通单轮约 75 分钟）打断。
  subsites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 派发三家子站跟随本轮刷新
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          api() {
            curl -fsSL --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: tariff-subsites" "$1"
          }
          dispatch() {
            curl -fsS --max-time 30 -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: tariff-subsites" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1.yml/dispatches" >/dev/null
          }
          active() {
            local j n
            j=$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/$1.yml/runs?per_page=5") || { echo 0; return 0; }
            n=$(printf '%s' "$j" | jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "waiting")] | length') || n=0
            echo "$n"
          }
          # 数据够旧才派发：子站单轮 8~75 分钟，若刚更新过又派一轮纯属重复抓取，
          # 还会把下一轮挤到并发组里互踩。阈值 100 分钟 ≈ 主站 2 小时的节拍留余量。
          data_age() {
            local dir=$1 u ts
            u=$(api "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${dir}/data/latest.json" \
                | jq -r '.updated // empty' 2>/dev/null) || u=""
            [ -n "$u" ] || { echo 999999; return 0; }
            ts=$(date -u -d "$u" +%s 2>/dev/null) || { echo 999999; return 0; }
            echo $(( $(date -u +%s) - ts ))
          }
          for wf in unicom-build telecom-build gb-build; do
            n=$(active "$wf")
            if [ "$n" != "0" ]; then
              echo "[$wf] 已有 $n 个运行在进行/排队，跳过"
              continue
            fi
            age=$(data_age "${wf%-build}")
            if [ "$age" -lt 6000 ]; then
              echo "[$wf] 数据距今 $((age/60)) 分钟，仍然新鲜，本轮跳过"
              continue
            fi
            ok=0
            for i in 1 2 3; do
              if dispatch "$wf"; then ok=1; echo "[$wf] 已派发 $(date -u +%FT%TZ)"; break; fi
              echo "::warning::派发 $wf 失败（$i/3），10s 后重试"
              sleep 10
            done
            [ "$ok" = "1" ] || echo "::warning::$wf 本轮未派发，由看门狗 / 心跳兜底"
          done

# fork: enabled for personal deployment
